name: Health check

# End-to-end read-only check against the live Chrome UX Report API
# (chromeuxreport.googleapis.com). Auth is a long-lived Google Cloud API key stored as a repo
# secret — no per-run minting. smoke makes NO writes (pulls the latest LCP record for a sample
# origin; the API has no write endpoints). Runs daily + manual dispatch only (never on push/PR),
# so the secret isn't exposed to PRs/forks. The smoke step is skipped when the secret is not set
# (e.g. on forks), keeping the workflow green instead of failing on missing credentials.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-google-crux'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: ${{ secrets.CRUX_API_KEY != '' }}
        run: npm run smoke
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
